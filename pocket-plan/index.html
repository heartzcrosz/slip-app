<style>
:root{--bg:#0a0e1a;--bar:#0d1222;--line:#222b47;--ink:#edf0f7;--mute:#8e98b5;--gold:#34d399;--gold-soft:rgba(52,211,153,.14);--seg:#11172a;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f2f6;--bar:#ffffff;--line:#e2e5ee;--ink:#121831;--mute:#5a6380;--gold:#047857;--gold-soft:rgba(4,120,87,.1);--seg:#f4f5f9;color-scheme:light}}
:root[data-theme="light"]{--bg:#f1f2f6;--bar:#ffffff;--line:#e2e5ee;--ink:#121831;--mute:#5a6380;--gold:#047857;--gold-soft:rgba(4,120,87,.1);--seg:#f4f5f9;color-scheme:light}
:root[data-theme="dark"]{--bg:#0a0e1a;--bar:#0d1222;--line:#222b47;--ink:#edf0f7;--mute:#8e98b5;--gold:#34d399;--gold-soft:rgba(52,211,153,.14);--seg:#11172a;color-scheme:dark}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:14px/1.4 "IBM Plex Sans Thai","Noto Sans Thai",system-ui,Tahoma,sans-serif;transition:background-color .3s}
.bar{flex:none;display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--bar);border-bottom:1px solid var(--line);transition:background-color .3s,border-color .3s}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;white-space:nowrap}
.brand i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold);font-style:normal}
.seg{flex:1;display:flex;gap:3px;max-width:440px;margin-left:auto;padding:3px;border:1px solid var(--line);border-radius:12px;background:var(--seg)}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 12px;border:0;border-radius:9px;background:none;color:var(--mute);font:inherit;font-weight:500;cursor:pointer;white-space:nowrap;transition:background-color .15s,color .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--gold-soft);color:var(--gold);font-weight:600;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 40%,transparent)}
.tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:560px){.brand span{display:none}.seg{max-width:none}}
.stage{position:relative;flex:1;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none}
iframe.on{display:block}
.ld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.brand{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:default;touch-action:manipulation}
.brand.hold i{transform:scale(.88);transition:transform .6s}
.bk{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:16px;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
@media (min-width:600px){.bk{align-items:center}}
.bk[hidden]{display:none}
.bk-c{width:100%;max-width:440px;padding:20px;border-radius:20px;background:var(--bar);border:1px solid var(--line);color:var(--ink);box-shadow:0 24px 60px -20px rgba(0,0,0,.7);animation:bkin .25s cubic-bezier(.2,.8,.2,1)}
@keyframes bkin{from{opacity:0;transform:translateY(16px)}}
.bk-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.bk-h b{font-size:17px}
.bk-x{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--seg);color:var(--mute);font:inherit;font-size:16px;cursor:pointer}
.bk-c p{margin:0 0 16px;color:var(--mute);font-size:13px;line-height:1.5}
.bk-b{display:flex;flex-direction:column;gap:10px}
.bk-btn{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--seg);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.bk-btn:hover{border-color:var(--gold)}
.bk-btn i{width:36px;height:36px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold);font-style:normal}
.bk-btn span{display:flex;flex-direction:column;line-height:1.35}
.bk-btn small{color:var(--mute);font-size:12px}
.bk-btn:disabled{opacity:.5;cursor:default}
.bk-st{min-height:20px;margin-top:12px;font-size:13px;color:var(--mute);line-height:1.5}
.bk-st.ok{color:var(--gold)}.bk-st.er{color:#ff6b81}
.bk-cf{margin-top:12px;padding:12px;border-radius:14px;border:1px solid rgba(255,107,129,.45);background:rgba(255,107,129,.08)}
.bk-cf[hidden]{display:none}
.bk-cf div{display:flex;gap:8px;margin-top:10px}
.bk-cf button{flex:1;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--seg);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.bk-cf button.go{background:#ff6b81;border-color:#ff6b81;color:#1a0509}

html{height:100%;background:var(--bar)}
:root{padding-top:0!important;padding-bottom:0!important}
html,body{overflow:hidden;overscroll-behavior:none}
body{position:fixed;top:0;left:0;right:0;bottom:auto;height:100vh!important;height:100lvh!important}
.bar{padding-top:calc(8px + env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.stage{background:var(--bg)}
iframe{background:var(--bg)}
#sab-probe{position:fixed;left:0;bottom:0;width:0;height:env(safe-area-inset-bottom,0px);visibility:hidden;pointer-events:none}
.brand i.lg{background:none;overflow:hidden;border-radius:8px}
.brand i.lg img{width:26px;height:26px;display:block}
.bk{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
</style></head>

  <div class="bk-h"><b id="bk-t">ข้อมูลสำรอง (CSV)</b><button class="bk-x" id="bk-x" aria-label="ปิด">✕</button></div>
  <p>ไฟล์เดียวรวมข้อมูลทั้งหมด: สลีปรายวัน หมวดหมู่ งบต่อวัน/ต่อเดือน และงบรายเดือนทุกเดือน</p>
  <div class="bk-b">
   <button class="bk-btn" id="bk-ex"><i><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5"/><path d="M4 18v1a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1"/></svg></i><span>ส่งออกข้อมูลทั้งหมด<small>ดาวน์โหลดเป็นไฟล์ .csv</small></span></button>
   <button class="bk-btn" id="bk-im"><i><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 18v1a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1"/></svg></i><span>นำเข้าข้อมูลทั้งหมด<small>แทนที่ข้อมูลปัจจุบันด้วยไฟล์ที่ส่งออกไว้</small></span></button>
   <input type="file" id="bk-file" accept=".csv,text/csv,text/plain" hidden>
  </div>
  <div class="bk-cf" id="bk-cf" hidden><span id="bk-cft"></span><div><button id="bk-no">ยกเลิก</button><button class="go" id="bk-go">ยืนยัน แทนที่ข้อมูล</button></div></div>
  <div class="bk-st" id="bk-st"></div>
 </div>
</div>
<script>
/* Pocket Plan runs outside Claude: data stays in this phone's storage;
   files are handed to the iOS share sheet ("Save to Files") */
(function(){
  if(window.claude&&window.claude.use)return;
  async function saveFile(o){
    const name=o.filename||'pocket-plan.csv', text=typeof o.data==='string'?o.data:String(o.data||'');
    const file=new File([text],name,{type:'text/csv'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:name});return}
      catch(e){if(e&&e.name==='AbortError')throw {code:'cancelled'}}
    }
    const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
  }
  window.setSab=k=>{try{let p=document.getElementById('sab-probe');if(!p){p=document.createElement('div');p.id='sab-probe';document.body.appendChild(p)}
    const v=p.getBoundingClientRect().height||0;const d=document.getElementById('f-'+k).contentDocument;d.documentElement.style.setProperty('--sab',(v+8)+'px')}catch(e){}};
  const downloads={save:saveFile};
  window.claude={use:n=>Promise.resolve(n==='downloads'?downloads:null)};
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>

const TABS=['b','a'], TK='pocketplan:tab:v2', THK='pocketplan:theme';
const dec=s=>{const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(u)};
const F=k=>document.getElementById('f-'+k);
const loaded={};
let theme=null; try{theme=localStorage.getItem(THK)}catch(e){}
const setTheme=t=>{if(t!=='dark'&&t!=='light')return;theme=t;document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem(THK,t)}catch(e){}};
setTheme(theme||'dark');
const themeOf=k=>{try{return F(k).contentDocument.documentElement.getAttribute('data-theme')}catch(e){return null}};
const toggleOf=k=>{try{const d=F(k).contentDocument;return d.getElementById('sw')||d.getElementById('theme')}catch(e){return null}};
// keep both pages and this bar on the same light/dark mode by pressing each page's own toggle
function align(k){const t=themeOf(k);if(theme&&t&&t!==theme){const b=toggleOf(k);if(b)b.click()}}
function watch(k){
  try{
    const el=F(k).contentDocument.documentElement;
    new MutationObserver(()=>{const t=themeOf(k);if(!t||t===theme)return;setTheme(t);TABS.forEach(o=>{if(o!==k&&loaded[o])align(o)})}).observe(el,{attributes:true,attributeFilter:['data-theme']});
  }catch(e){}
}
function show(t){
  TABS.forEach(k=>{const on=k===t;document.getElementById('t-'+k).setAttribute('aria-selected',on);F(k).classList.toggle('on',on)});
  if(!loaded[t])loadFrame(t);
  else{const l=document.getElementById('ld');if(l)l.remove()}
  try{localStorage.setItem(TK,t)}catch(e){}
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>show(b.dataset.t)));
let first='b';try{const s=localStorage.getItem(TK);if(TABS.includes(s))first=s}catch(e){}
show(first);
/* ---- hidden backup: long-press the logo ---- */
function loadFrame(k){
  if(loaded[k])return;loaded[k]=1;
  const f=F(k);
  f.addEventListener('load',()=>{setSab(k);const l=document.getElementById('ld');if(l&&F(k).classList.contains('on'))l.remove();align(k);watch(k)},{once:true});
  f.srcdoc=dec(SRC[k]);
}
function ready(k){
  loadFrame(k);
  return new Promise((res,rej)=>{const t0=Date.now();(function poll(){
    let w;try{w=F(k).contentWindow}catch(e){}
    if(w&&w.__ppReady&&w.__ppGet)return res(w);
    if(Date.now()-t0>20000)return rej(new Error('timeout'));
    setTimeout(poll,150)})()});
}
const BK=id=>document.getElementById(id);
const COLS=['section','month','date','time','group','name','payee','amount','color','note','options'];
const csvq=v=>{v=v==null?'':String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const row=o=>COLS.map(c=>csvq(o[c])).join(',');
const optStr=o=>{const k=Object.keys(o).filter(x=>o[x]!==undefined&&o[x]!==''&&o[x]!==false);if(!k.length)return '';const r={};k.forEach(x=>r[x]=o[x]);return JSON.stringify(r)};
function buildCSV(sl,bd){
  const L=[COLS.join(',')];
  L.push(row({section:'setting',name:'daily_budget',amount:+sl.limit||0}));
  L.push(row({section:'setting',name:'monthly_budget',amount:+sl.mlimit||0}));
  (sl.cats||[]).forEach(c=>L.push(row({section:'slip_category',group:c.name,color:c.color})));
  (sl.items||[]).slice().sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))).forEach(i=>
    L.push(row({section:'slip',date:i.date,time:i.time,group:i.cat,name:i.note,payee:i.payee,amount:i.amount,options:optStr({nodup:i.nodup,check:i.check,warn:i.warn})})));
  Object.keys(bd.months||{}).sort().forEach(m=>{const M=bd.months[m];
    (M.income||[]).forEach(x=>L.push(row({section:'income',month:m,name:x.n,amount:x.a})));
    (M.groups||[]).forEach(g=>{
      const ex={};Object.keys(g).forEach(k=>{if(!['name','note','color','items','id'].includes(k))ex[k]=g[k]});ex.gid=g.id;
      L.push(row({section:'budget_group',month:m,group:g.name,color:g.color,note:g.note,options:JSON.stringify(ex)}));
      (g.items||[]).forEach(x=>L.push(row({section:'budget_item',month:m,group:g.name,name:x.n,amount:x.a,options:JSON.stringify({gid:g.id})})));
    });
    (M.tracks||[]).forEach(x=>L.push(row({section:'balance',month:m,name:x.n,amount:x.a})));
  });
  const meta={};Object.keys(bd).forEach(k=>{if(k!=='months')meta[k]=bd[k]});
  L.push(row({section:'budget_meta',options:JSON.stringify(meta)}));
  return '﻿'+L.join('\n');
}
function parseCSV(t){
  t=t.replace(/^﻿/,'');const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===','){r.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';rows.push(r);r=[]}
    else c+=ch}
  if(c!==''||r.length){r.push(c);rows.push(r)}
  return rows.filter(x=>x.some(y=>y.trim()!==''));
}
const p2=n=>String(n).padStart(2,'0');
const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
const fixY=y=>{y=+y;if(y<100)y+=2000;if(y>2400)y-=543;return y};
function normDate(s){s=String(s||'').trim();let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return fixY(m[1])+'-'+p2(m[2])+'-'+p2(m[3]);
  if(m=s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/))return fixY(m[3])+'-'+p2(m[2])+'-'+p2(m[1]);
  return ''}
function normMonth(s){s=String(s||'').trim();let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})(?:-\d{1,2})?$/))return fixY(m[1])+'-'+p2(m[2]);
  if(m=s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})$/))return fixY(m[3])+'-'+p2(m[2]);
  if(m=s.match(/^([a-z]{3})[a-z]*[-\s'](\d{2,4})$/i)&&MON[m[1].toLowerCase()])return fixY(m[2])+'-'+p2(MON[m[1].toLowerCase()]);
  return ''}
const normTime=s=>{const m=String(s||'').match(/(\d{1,2}):(\d{2})/);return m?p2(m[1])+':'+m[2]:''};
const num=s=>{const v=parseFloat(String(s??'').replace(/[,\s฿]/g,''));return isFinite(v)?v:0};
const jopt=s=>{try{const o=JSON.parse(s||'{}');return o&&typeof o==='object'?o:{}}catch(e){return {}}};
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);
function readBackup(text){
  const rows=parseCSV(text);if(!rows.length)throw new Error('ไฟล์ว่าง');
  const h=rows[0].map(x=>x.trim().toLowerCase()),ix={};COLS.forEach(c=>ix[c]=h.indexOf(c));
  if(ix.section<0)throw new Error('ไม่ใช่ไฟล์สำรองของแอปนี้ (ไม่พบคอลัมน์ section)');
  const RAW=['group','name','payee','note'],g=(r,c)=>{const v=ix[c]<0?'':String(r[ix[c]]??'');return RAW.includes(c)?v:v.trim()};
  const sl={items:[],cats:[],limit:0,mlimit:0},bd={months:{}};let hasS=false,hasB=false,bad=0;
  const mon=k=>bd.months[k]=bd.months[k]||{income:[],groups:[],tracks:[]};
  for(const r of rows.slice(1)){const s=g(r,'section').toLowerCase();
    if(s==='setting'){hasS=true;const n=g(r,'name');if(n==='daily_budget')sl.limit=num(g(r,'amount'));else if(n==='monthly_budget')sl.mlimit=num(g(r,'amount'))}
    else if(s==='slip_category'){hasS=true;const n=g(r,'group'),c=g(r,'color');if(n)sl.cats.push({name:n,color:/^#[0-9a-f]{6}$/i.test(c)?c:'#6b7280'})}
    else if(s==='slip'){hasS=true;const d=normDate(g(r,'date'));if(!d){bad++;continue}
      const it={id:uid(),date:d,time:normTime(g(r,'time')),amount:num(g(r,'amount')),payee:g(r,'payee'),note:g(r,'name'),cat:g(r,'group'),check:false};
      const o=jopt(g(r,'options'));if(o.nodup)it.nodup=true;if(o.check){it.check=true;if(o.warn)it.warn=String(o.warn)}
      sl.items.push(it)}
    else if(['income','budget_group','budget_item','balance'].includes(s)){hasB=true;const m=normMonth(g(r,'month'));if(!m){bad++;continue}const M=mon(m);
      if(s==='income')M.income.push({id:uid(),n:g(r,'name'),a:num(g(r,'amount'))});
      else if(s==='balance')M.tracks.push({id:uid(),n:g(r,'name'),a:num(g(r,'amount'))});
      else if(s==='budget_group'){const o=jopt(g(r,'options')),gr={id:o.gid||uid(),name:g(r,'group')||'หมวด',note:g(r,'note'),color:/^#[0-9a-f]{6}$/i.test(g(r,'color'))?g(r,'color'):'#3b82f6',count:o.count!==false,items:[]};
        Object.keys(o).forEach(k=>{if(!['gid','count'].includes(k))gr[k]=o[k]});M.groups.push(gr)}
      else{const o=jopt(g(r,'options')),gn=g(r,'group');
        let gr=M.groups.find(x=>o.gid&&x.id===o.gid)||M.groups.find(x=>x.name===gn);
        if(!gr){gr={id:uid(),name:gn||'หมวด',note:'',color:'#3b82f6',count:true,items:[]};M.groups.push(gr)}
        gr.items.push({id:uid(),n:g(r,'name'),a:num(g(r,'amount'))})}}
    else if(s==='budget_meta'){const o=jopt(g(r,'options'));delete o.months;Object.assign(bd,o)}
    else if(s)bad++;
  }
  const months=Object.keys(bd.months);
  if(hasB&&!months.length)hasB=false;
  if(hasB&&!bd.months[bd.cur])bd.cur=months.sort().pop();
  if(!hasS&&!hasB)throw new Error('ไม่พบข้อมูลที่นำเข้าได้ในไฟล์นี้');
  return {sl:hasS?sl:null,bd:hasB?bd:null,bad,months:months.length};
}
let pending=null;
const say=(t,k)=>{const e=BK('bk-st');e.textContent=t;e.className='bk-st'+(k?' '+k:'')};
const stamp=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
function openBk(){pending=null;BK('bk-cf').hidden=true;say('');BK('bk').hidden=false;BK('bk-ex').focus()}
function closeBk(){BK('bk').hidden=true}
BK('bk-x').onclick=closeBk;
BK('bk').addEventListener('click',e=>{if(e.target===BK('bk'))closeBk()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!BK('bk').hidden)closeBk()});
BK('bk-ex').onclick=async()=>{
  const b=BK('bk-ex');b.disabled=true;say('กำลังรวบรวมข้อมูลทั้งหมด…');
  try{
    const [wb,wa]=await Promise.all([ready('b'),ready('a')]);
    const sl=JSON.parse(wb.__ppGet()),bd=JSON.parse(wa.__ppGet());
    const csv=buildCSV(sl,bd),name='pocket-plan-backup-'+stamp()+'.csv';
    let dl=null;try{dl=window.claude&&claude.use?await claude.use('downloads'):null}catch(e){}
    if(dl){await dl.save({filename:name,data:csv})}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
    say('✓ ส่งออกแล้ว: สลีป '+(sl.items||[]).length+' รายการ · งบ '+Object.keys(bd.months||{}).length+' เดือน','ok');
  }catch(e){if(e&&e.code==='cancelled')say('ยกเลิกการบันทึกไฟล์');else say('✗ ส่งออกไม่สำเร็จ'+(e&&e.code?' ['+e.code+']':e&&e.message?' · '+e.message:''),'er')}
  b.disabled=false;
};
BK('bk-im').onclick=()=>BK('bk-file').click();
BK('bk-file').onchange=async e=>{
  const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  try{
    pending=readBackup(await f.text());
    const parts=[];if(pending.sl)parts.push('สลีป '+pending.sl.items.length+' รายการ');if(pending.bd)parts.push('งบ '+pending.months+' เดือน');
    BK('bk-cft').textContent='พบ '+parts.join(' · ')+(pending.bad?' (ข้ามบรรทัดที่อ่านไม่ได้ '+pending.bad+')':'')+' — ข้อมูลปัจจุบันในส่วนนี้จะถูกแทนที่ทั้งหมด แนะนำให้ส่งออกเก็บไว้ก่อน';
    BK('bk-cf').hidden=false;say('');
  }catch(err){pending=null;BK('bk-cf').hidden=true;say('✗ '+(err.message||'อ่านไฟล์ไม่ได้'),'er')}
};
BK('bk-no').onclick=()=>{pending=null;BK('bk-cf').hidden=true;say('ยกเลิกแล้ว')};
BK('bk-go').onclick=async()=>{
  if(!pending)return;const p=pending;pending=null;BK('bk-cf').hidden=true;say('กำลังนำเข้า…');
  try{
    if(p.sl){const w=await ready('b');w.__ppSet(JSON.stringify(p.sl))}
    if(p.bd){const w=await ready('a');w.__ppSet(JSON.stringify(p.bd))}
    say('✓ นำเข้าเรียบร้อย'+(p.sl?' · สลีป '+p.sl.items.length+' รายการ':'')+(p.bd?' · งบ '+p.months+' เดือน':''),'ok');
  }catch(e){say('✗ นำเข้าไม่สำเร็จ'+(e&&e.message?' · '+e.message:''),'er')}
};
(()=>{const br=document.querySelector('.brand');let t=null,x0=0,y0=0;
  const stop=()=>{clearTimeout(t);t=null;br.classList.remove('hold')};
  br.addEventListener('pointerdown',e=>{x0=e.clientX;y0=e.clientY;br.classList.add('hold');t=setTimeout(()=>{stop();openBk()},700)});
  br.addEventListener('pointermove',e=>{if(t&&Math.hypot(e.clientX-x0,e.clientY-y0)>10)stop()});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>br.addEventListener(ev,stop));
  br.addEventListener('contextmenu',e=>e.preventDefault());
})();
